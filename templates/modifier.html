{% extends "base.html" %}

{% block title %}Modifier un événement — Tracker thermique
{% endblock %}

{% block content %}
	<h1>Modifier un événement</h1>

	<div class="card" style="max-width: 500px;">
		<form method="POST">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<label>
				Date
				<input type="date" name="date" value="{{ evenement.date }}" required>
			</label>
			<label>
				Zone
				<input type="text" name="zone" value="{{ evenement.zone }}" required>
			</label>
			<label>
				Type
				<input type="text" name="type_evenement" value="{{ evenement.type_evenement }}" required>
			</label>
			<label>
				Description
				<textarea name="description" rows="4">{{ evenement.description }}</textarea>
			</label>
			<button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
			<a href="{{ url_for('donnees') }}" class="btn">Annuler</a>
		</form>
	</div>
{% endblock %}
