<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>
			{% block title %}Tracker thermique par satellite
			{% endblock %}
		</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> {% block extra_head %}{% endblock %}
		</head>
		<body>
			<nav class="nav">
				<a href="{{ url_for('home') }}" class="nav-brand">
					<span class="nav-dot"></span>
					Tracker thermique
				</a>
				<div class="nav-links">
					<a href="{{ url_for('home') }}">Accueil</a>
					<a href="{{ url_for('donnees') }}">Données</a>
					{% if current_user.is_authenticated %}
						<a href="{{ url_for('importer') }}">Importer</a>
						<a href="{{ url_for('nouveau') }}">Ajouter</a>
						<span class="nav-user">{{ current_user.username }}</span>
						<a href="{{ url_for('logout') }}" class="nav-logout">Déconnexion</a>
					{% else %}
						<a href="{{ url_for('login') }}">Connexion</a>
					{% endif %}
				</div>
			</nav>

			<main class="main"> {% block content %}{% endblock %}
				</main>

				{% block extra_scripts %}{% endblock %}
			</body>
		</html>
